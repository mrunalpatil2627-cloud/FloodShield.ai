<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FloodShield AI – Pune Command</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root[data-theme=dark]{--bg:#0b1622;--card:#122131;--ink:#e6eef7;--mute:#8ea3b6;--line:#22364a;--acc:#5a9bff;--a2:#16304f}

.pri{background:var(--acc);border-color:var(--acc);color:#fff}.dk{background:#0f2a43;color:#fff;border-color:#0f2a43}

.logo{display:flex;gap:10px;align-items:center}.logo i{width:38px;height:38px;border-radius:10px;background:#0f4c9a;display:grid;place-items:center;color:#fff;font-style:normal}.logo b{font-size:16px;font-weight:800}.logo small{display:block;color:var(--mute);font-size:11px}
nav{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px;overflow-x:auto}nav button{border:0;background:transparent;color:var(--mute);border-radius:99px;padding:7px 16px}nav button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px #0002}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ok{color:var(--low);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:600}.ok:before{content:"● "}
.pg{display:none;max-width:1440px;margin:0 auto;padding:22px 24px 40px}.pg.on{display:block}
.eye{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.eye span{color:var(--mute);font-weight:500;text-transform:none;letter-spacing:0;margin-left:8px}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0}h2{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}.mute{color:var(--mute)}

.g{display:grid;gap:16px}.g2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.acts{margin-left:0}}

.cr{color:var(--crit)}.hi{color:var(--high)}.lo{color:var(--low)}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}.sc{background:#d93a3a22;color:var(--crit)}.sh{background:#ef8a1f22;color:var(--high)}.sm{background:#e6b42233;color:#b38600}.sl{background:#2fa86b22;color:var(--low)}
.map svg{display:block;width:100%;height:auto;border-radius:12px 12px 0 0}.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#0f2a43;border-radius:0 0 12px 12px;color:#cfe0f3;font-size:11px}.tl button{background:transparent;color:#cfe0f3;border:0;padding:4px 10px;border-radius:99px}.tl button.on{background:var(--acc);color:#fff}.tl span{margin-left:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card);width:100%;text-align:left}.row.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--a2)}
.ev{border-left:3px solid var(--acc);background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);text-align:left;padding:12px}td{padding:13px 12px;border-top:1px solid var(--line)}
.chips{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}.chips button{border:0;background:transparent;color:var(--mute)}.chips button.on{background:var(--acc);color:#fff}
.rt{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card)}.rt.best{border:2px solid var(--acc);box-shadow:0 0 0 3px var(--a2)}.rt ul{margin:8px 0 0;padding:0;list-style:none}.rt li:before{content:"✓ ";color:var(--low)}
.bar{height:7px;background:var(--line);border-radius:4px}.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f2a43;color:#fff;padding:11px 18px;border-radius:10px;max-width:92vw;display:none;z-index:9;box-shadow:0 6px 20px #0005}
select{font:inherit;font-weight:600;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body>
<header class="top"><div class="logo"><i>⛨</i><div><b>FLOODSHIELD AI</b><small>Urban Resilience Intelligence</small></div></div>
<nav id="nav"><button class="on" data-p="ov">Overview</button><button data-p="in">Forecast</button><button data-p="ic">Signals</button><button data-p="rs">Response</button><button data-p="an">Analytics</button></nav>
<div class="acts"><span class="ok">Systems Operational</span><button id="sim">▶ Simulation</button><button id="cop">AI Copilot</button><b>OP</b><span class="mute" style="line-height:1.2">Chief Officer<br>Pune EOC Command</span></div></header>

<section class="pg on" id="ov"></section><section class="pg" id="in"></section><section class="pg" id="ic"></section><section class="pg" id="rs"></section><section class="pg" id="an"></section>
<script>
const $=s=>document.querySelector(s);
const Z=[{id:'Z-01',n:'Riverside Ward',sub:'Bund Garden Basin',x:560,y:340,b:87,d:4.5,pop:8420,rain:120,v:94,lv:4.3},{id:'Z-02',n:'Sangamwadi Confluence Axis',sub:'Sangamwadi',x:470,y:300,b:81,d:4.8,pop:4800,rain:114,v:88,lv:4.1},{id:'Z-03',n:'Deccan Gymkhana & Pulachi Wadi',sub:'Deccan',x:330,y:250,b:74,d:5,pop:5100,rain:105,v:71,lv:3.9},{id:'Z-04',n:'Yerwada Golf Club Road',sub:'Yerwada',x:660,y:200,b:58,d:5.5,pop:9870,rain:92,v:63,lv:3.5},{id:'Z-05',n:'Kothrud Lowlands',sub:'Kothrud',x:190,y:340,b:41,d:6.5,pop:2100,rain:74,v:52,lv:3.1}];
const SH=[{id:'S-04',n:'COEP Engineering Campus',x:250,y:170,beds:1200},{id:'S-02',n:'Kothrud Municipal School',x:110,y:420,beds:800},{id:'S-07',n:'Yerwada Sports Complex',x:740,y:130,beds:900}];
const INC=[['INC-2048','Rapid water surge submerging Riverside Junction','Riverside Road, Near Sangam Confluence','Citizen Report','CRITICAL',94,1,'2 min ago',590,325],['INC-2049','Deccan Z-Bridge Underpass submerged 1.1m','Z-Bridge Vehicular Underpass','CCTV AI Vision','HIGH',91,1,'6 min ago',350,265],['INC-2050','Pulachi Wadi shanties threatened by Mutha backflow','Pulachi Wadi Riverbank Slum Cluster','Emergency Call','CRITICAL',88,1,'11 min ago',300,235],['INC-2051','Trunk drain burst near Yerwada Golf Club Road','Golf Club Link Road, Yerwada','Social Signal','HIGH',78,0,'14 min ago',680,190],['INC-2052','Bund Garden Weir backflow pressure alarm','Bund Garden Historical Weir','IoT Sensor Alert','MODERATE',82,1,'19 min ago',520,310],['INC-2053','Waterlogging outside Koregaon Park Lane 1 bistro','North Main Road Lane 1','Citizen Report','LOW',42,0,'25 min ago',700,250]];
const TL=['Today','+1D','+2D','+3D','+5D','+7D'],M=[.48,.6,.75,.92,1.04,.8],DAYS=[0,1,2,3,5,7],RAIN=[12,28,55,92,120,86,40,18],RV=[2.6,2.9,3.3,3.8,4.3,4.4,3.9,3.2],SS=[48,58,71,83,91,93,88,78],SOIL=[93,90,86,81,74],ELV=[545,548,552,556,563],DRN=[38,44,52,47,61];
const LOG=['Forecast run updated: Riverside Ward peak risk 87/100 around Day 5 · 2h ago','Route A (Riverside underpass) projected impassable at peak · 3h ago','Soil saturation at 93% in Z-01: runoff will be near-total · 5h ago'];
let T=0,ZS=0,uf=0,flt='ALL',mode='ev',xai=0,auth=0,pl=0,pt=0,tab='ov';
const col=r=>r>=80?'#d93a3a':r>=65?'#ef8a1f':r>=45?'#e6b422':'#2fa86b',lab=r=>r>=80?'Critical':r>=65?'High':r>=45?'Moderate':'Low';
const risk=z=>Math.min(99,Math.round(z.b*M[T])),pc=s=>s=='CRITICAL'?'sc':s=='HIGH'?'sh':s=='MODERATE'?'sm':'sl';
const near=z=>SH.map(s=>[Math.hypot(s.x-z.x,s.y-z.y),s]).sort((a,b)=>a[0]-b[0])[0];
function routes(z){const[d,s]=near(z),r=z.b;return[['A','Direct underpass',0,1,.9],['B','Commercial spine',75,1.75,.45],['C','Elevated corridor',-85,1.38,.1]].map(([k,n,o,tm,e])=>{const a=k=='A'&&uf,sf=Math.round(100*(1-(a?1:e)*(a?1:Math.min(1,r/90)))),mx=(z.x+s.x)/2,my=(z.y+s.y)/2,dx=s.x-z.x,dy=s.y-z.y,L=Math.hypot(dx,dy);return{k,n,mins:Math.round(d/44*tm),sf,st:sf<35?'BLOCKED':sf<75?'MODERATE':'SAFE',cx:mx-dy/L*o,cy:my+dx/L*o,s,z,r}})}
const best=R=>R.reduce((a,c)=>c.sf>a.sf||(c.sf==a.sf&&c.mins<a.mins)?c:a);
const rc=st=>st=='BLOCKED'?'#d93a3a':st=='MODERATE'?'#ef8a1f':'#2fd27a';
function map(full){const o=Z[ZS],R=routes(o),b=best(R);let h=`<div class="map"><svg viewBox="0 0 900 480" role="img" aria-label="Pune flood map"><rect width="900" height="480" fill="#33463a"/><g stroke="#7d8b80" stroke-width="2" fill="none" opacity=".55"><path d="M0 300H900M120 0V480M420 0L520 480M0 120L900 260M640 0L700 480"/></g><path d="M20 40C200 110 300 250 430 290S700 370 890 420" stroke="#3b8fd0" stroke-width="16" fill="none" opacity=".9"/><g fill="#fff" font-size="12" opacity=".75"><text x="380" y="190">Shivajinagar</text><text x="600" y="395">Bund Garden</text><text x="60" y="300">Kothrud</text><text x="730" y="215">Yerwada</text></g>`;
Z.forEach((z,i)=>{const r=risk(z),p=[0,1,2,3,4,5].map(k=>[Math.round(z.x+46*Math.cos(k*Math.PI/3)),Math.round(z.y+38*Math.sin(k*Math.PI/3))]).join(' ');h+=`<polygon points="${p}" fill="${col(r)}" fill-opacity=".45" stroke="${col(r)}" stroke-width="${i==ZS?4:2}"/><text x="${z.x}" y="${z.y+4}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${z.id} · ${r}</text>`});
(full?R:[b]).forEach(c=>{const isb=c==b;h+=`<path d="M${c.z.x} ${c.z.y}Q${c.cx} ${c.cy} ${c.s.x} ${c.s.y}" fill="none" stroke="${rc(c.st)}" stroke-width="${isb?6:3}" stroke-dasharray="${c.st=='BLOCKED'?'8 6':''}" stroke-linecap="round"/>`;if(c.k=='A'&&full){const x=(c.z.x+2*c.cx+c.s.x)/4,y=(c.z.y+2*c.cy+c.s.y)/4;h+=`<circle cx="${x}" cy="${y}" r="9" fill="${rc(c.st)}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">U</text>`}});
SH.forEach(s=>h+=`<path d="M${s.x} ${s.y-10}l9 16h-18z" fill="#2fa86b" stroke="#fff" stroke-width="2"/><text x="${s.x}" y="${s.y+22}" fill="#fff" font-size="11" text-anchor="middle">${s.id}</text>`);
INC.forEach(i=>h+=`<circle cx="${i[8]}" cy="${i[9]}" r="6" fill="${i[6]?col(i[4]=='CRITICAL'?90:i[4]=='HIGH'?70:50):'none'}" stroke="#fff" stroke-width="2"/>`);
const n=[0,0,0,0];Z.forEach(z=>{const r=risk(z);n[r>=80?3:r>=65?2:r>=45?1:0]++});
h+=`</svg><div class="tl">${TL.map((t,i)=>`<button data-t="${i}" class="${i==T?'on':''}">${t}</button>`).join('')}<span>Low ${n[0]} · Moderate ${n[1]} · High ${n[2]} · Critical ${n[3]} zones</span></div></div>`;return h}
function gauge(s){const C=2*Math.PI*62,d=s/100*.75*C;return`<svg viewBox="0 0 160 160" style="width:190px;display:block;margin:auto"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--line)" stroke-width="12" stroke-dasharray="${.75*C} ${C}" transform="rotate(135 80 80)" stroke-linecap="round"/><circle cx="80" cy="80" r="62" fill="none" stroke="${col(s)}" stroke-width="12" stroke-dasharray="${d} ${C}" transform="rotate(135 80 80)" stroke-linecap="round"/><text x="80" y="88" text-anchor="middle" font-size="40" font-weight="800" fill="var(--ink)">${s}</text><text x="80" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="var(--mute)">OUT OF 100</text></svg>`}
const fusion=()=>{const d=DAYS[T];return`<div class="g g3" style="margin-bottom:12px"><div class="mini"><small>Weather · ${TL[T]}</small><b>${RAIN[d]} mm rain forecast</b></div><div class="mini"><small>River level</small><b class="${RV[d]>=4?'cr':''}">${RV[d]} m (danger 4.0)</b></div><div class="mini"><small>Land condition</small><b>${SS[d]}% soil saturation</b></div></div>`};
function hydro(){const L=['Today','+1D','+2D','+3D','+4D','+5D','+6D','+7D'],X=i=>110+i*95,Yw=v=>230-(v-2)*66,Ys=v=>230-(v-40)*3.2;let h=`<svg viewBox="0 0 900 270" style="width:100%"><rect x="${X(DAYS[T])-45}" y="20" width="90" height="210" fill="var(--a2)" rx="6"/><line x1="70" x2="850" y1="${Yw(4)}" y2="${Yw(4)}" stroke="#d93a3a" stroke-dasharray="5 4"/><text x="850" y="${Yw(4)-5}" text-anchor="end" font-size="10" fill="#d93a3a" font-weight="700">RIVER DANGER LEVEL (4.0m)</text>`;
RAIN.forEach((v,i)=>h+=`<rect x="${X(i)-18}" y="${230-v*1.5}" width="36" height="${v*1.5}" rx="4" fill="#b9d3f2" stroke="#1d63d8"/><text x="${X(i)}" y="${224-v*1.5}" text-anchor="middle" font-size="10" fill="#1d63d8">${v}</text><text x="${X(i)}" y="250" text-anchor="middle" font-size="10" fill="var(--mute)">${L[i]}</text>`);
h+=`<polyline fill="none" stroke="#d93a3a" stroke-width="2.5" points="${RV.map((v,i)=>X(i)+','+Yw(v))}"/><polyline fill="none" stroke="#1d63d8" stroke-width="2" stroke-dasharray="2 3" points="${SS.map((v,i)=>X(i)+','+Ys(v))}"/>`+RV.map((v,i)=>`<circle cx="${X(i)}" cy="${Yw(v)}" r="4" fill="#d93a3a"/>`).join('');return h+'</svg>'}
const roadmap=o=>{const f=Math.floor,s=[[0,'Activate flood EOC; review daily forecast runs'],[1,'Inspect and clear drains; check weir and river gauges'],[Math.max(2,f(o.d-2)),'Pre-position pumps, boats and ambulances'],[f(o.d-1.5),'Public advisory and multilingual cell broadcast for '+o.id],[f(o.d-1),'Evacuate vulnerable residents first (elderly, patients, low-lying huts)'],[f(o.d-.5),'Complete evacuation before the river crosses 4.0 m'],[Math.ceil(o.d+1.5),'Hold shelters, monitor recession, plan safe return']],cur=DAYS[T];return`<div class="card" style="margin-bottom:16px"><h2>Decision roadmap for ${o.n} · flood expected around Day ${o.d}</h2>${s.map(([d,t])=>`<div class="ev" style="${cur>=d?'border-color:var(--acc)':'opacity:.65'}"><b>Day ${d}</b> · ${t}${cur>=d?' <span class="pill sl">due by selected day</span>':''}</div>`).join('')}</div>`};
function alloc(w,n){const t=w.reduce((a,b)=>a+b,0),q=w.map(x=>t?x/t*n:0),f=q.map(Math.floor);let l=n-f.reduce((a,b)=>a+b,0);q.map((x,i)=>[x-f[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,l).forEach(([,i])=>f[i]++);return f}
function render(){const rs=Z.map(risk),ti=rs.indexOf(Math.max(...rs)),top=Z[ti],tr=rs[ti],pop=Z.reduce((a,z,i)=>a+(rs[i]>=55?z.pop:0),0),dep=auth?6:0,o=Z[ZS],R=routes(o),b=best(R);
$('#ov').innerHTML=`<div class="hd"><div><div class="eye">City Intelligence Overview<span>• Pune Municipal Basin Operations Console</span></div><h1>Early Flood Prediction & Decision Planning</h1><div class="mute">7-day forecasting that fuses weather models, river-gauge levels and terrain, soil and drainage data, so authorities can act days before the flood.</div></div><div><button data-p="in">Digital Twin Simulation</button> <button class="pri" data-p="rs">AI Response Protocol</button></div></div>
<div class="g g2"><div class="card"><h2>AI Situation Synthesis · ${TL[T]}</h2><div class="mini" style="padding:14px;margin-bottom:12px;font-size:14px">Forecast shows flood risk building across ${Z.filter(z=>z.b>=65).length} low-lying zones over the next 5 days. ${Z[0].n} is projected to peak at ${Z[0].b}/100 around Day 5 as heavy rain, a rising river and saturated soil combine. Authorities have about ${(Z[0].d-1.5).toFixed(1)} days to approve pre-emptive actions before evacuation must begin. Viewing ${TL[T]}: ${top.n} at ${tr}/100 (${lab(tr)}).</div>
<div class="g g4"><div class="mini"><small>Highest-risk sector</small><b class="cr">${top.n} (${tr}/100)</b></div><div class="mini"><small>Inundation onset</small><b>~${top.d} days to crest</b></div><div class="mini"><small>Exposed citizens</small><b>${top.pop.toLocaleString()} residents</b></div><div class="mini"><small>Model certainty</small><b class="lo">91% neural verified</b></div></div>
<div class="row" style="cursor:default;margin:14px 0 0;border:0;padding:0"><span><b>Active Recommendation:</b> <span class="mute">Approve Stage 1 prep: pre-position 4 pumps and 3 boats, clear Bund Garden drains, brief shelter managers.</span></span><button class="dk" data-p="rs">View Decision Roadmap →</button></div></div>
<div class="card"><h2>Projected City Risk · ${TL[T]} <span class="pill ${tr>=80?'sc':'sh'}" style="float:right">${lab(tr)}</span></h2>${gauge(tr)}<div class="row" style="cursor:default;border:0;padding:4px 0"><span class="mute">Threat Level</span><b style="color:${col(tr)}">${lab(tr)} Threat</b></div><div class="row" style="cursor:default;border:0;padding:4px 0"><span class="mute">Catchment Trend</span><b class="cr">↗ +14% vs yesterday's run</b></div><div class="row" style="cursor:default;border:0;padding:4px 0"><span class="mute">Weir Status</span><b>Bund Garden projected ${Math.min(99,Math.round(94*M[T]))}% capacity</b></div></div></div>
<div class="g g3" style="margin:16px 0"><div class="card kp"><small>Population at risk</small><div class="big">${pop.toLocaleString()}</div><div class="mute">Projected at ${TL[T]} across ${rs.filter(x=>x>=55).length} low-lying catchments</div></div><div class="card kp"><small>Forecast lead time</small><div class="big">${Z[0].d} <span class="mute" style="font-size:13px">days</span></div><div class="mute"><b style="color:var(--acc)">91% confidence</b> from weather, river and terrain data</div></div><div class="card kp"><small>Units ready to pre-position</small><div class="big lo">${10-dep} <span class="mute" style="font-size:13px">/ 10 units</span></div><div class="mute">${dep} pre-positioned • 75% fleet readiness</div></div></div>
<div class="g g2"><div>${map(0)}</div><div class="card"><h2>Priority Catchments <span style="float:right" class="pill sl">LIVE RANKED</span></h2>${Z.map((z,i)=>[z,rs[i],i]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([z,r,i])=>`<button class="row ${i==ZS?'on':''}" data-z="${i}"><span><b>${z.n}</b> <span class="mute">(${z.id})</span><br><span class="mute">${z.d-DAYS[T]>0?'Flood onset in ~'+(z.d-DAYS[T]).toFixed(1)+' days':T>4?'Receding':'Inundation window'} • ${z.pop.toLocaleString()} residents</span></span><span class="pill ${r>=80?'sc':'sh'}">${r}</span></button>`).join('')}<h2 style="margin-top:14px">Model updates & advisories</h2>${LOG.slice(0,4).map(l=>`<div class="ev">${l}</div>`).join('')}<button class="row" data-p="rs" style="justify-content:center;font-weight:700">View Evacuation Plan →</button></div></div>`;
const f=[['Forecast rainfall',34],['River level trend',26],['Soil saturation',18],['Low elevation',14],['Drainage capacity',8]];
$('#in').innerHTML=`<div class="card" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px"><div><div class="eye">Neural hydro-meteorological engine</div><h1>AI Flood Risk Forecast — Next 7 Days</h1><div class="mute">Forecast fusing weather models, river-gauge levels, terrain elevation, soil saturation and drainage capacity.</div></div><div style="display:flex;gap:10px"><div class="mini"><small>Overall probability</small><b class="cr" style="font-size:18px">${Z[0].b+2}% Critical</b></div><div class="mini"><small>Model confidence</small><b style="color:var(--acc);font-size:18px">94%</b></div></div></div>
<div class="card" style="margin-bottom:16px"><h2>7-day outlook: rainfall, river level and soil saturation</h2>${fusion()}${hydro()}<div class="mute" style="text-align:center">Bars: rainfall (mm/day) · Red line: river level (m) · Blue dotted: soil saturation (%) · Dashed: danger level</div></div>
<div class="g g2" style="grid-template-columns:minmax(260px,1fr) 2fr"><div class="card"><h2>Catchment risk matrix</h2>${Z.map((z,i)=>`<button class="row ${i==ZS?'on':''}" data-z="${i}"><span><b>${z.n}</b><br><span class="mute">Flood onset: ~Day ${z.d} • Peak rain: ${z.rain} mm/day</span></span><span class="pill ${rs[i]>=80?'sc':rs[i]>=65?'sh':'sm'}">${rs[i]}</span></button>`).join('')}</div>
<div class="card"><div class="hd" style="margin:0 0 12px"><div><div class="eye">${o.id} • Detailed hydro profile</div><h1 style="font-size:24px">${o.n} (${o.sub} Basin)</h1></div><button class="pri" data-x="1">Explainable AI Risk Factors</button></div><div class="g g4"><div class="mini"><small>Weather</small><b style="font-size:16px">${o.rain} mm/day peak</b><div class="mute">Heavy rain builds over 5 days</div></div><div class="mini"><small>River level</small><b class="cr" style="font-size:16px">${o.lv} m projected</b><div class="mute">Danger threshold 4.0 m</div></div><div class="mini"><small>Land condition</small><b class="hi" style="font-size:16px">${SOIL[ZS]}% soil saturation</b><div class="mute">Elevation ${ELV[ZS]} m · drainage ${DRN[ZS]}%</div></div><div class="mini"><small>Exposure</small><b style="font-size:16px">${o.pop.toLocaleString()} residents</b><div class="mute">${o.v}/100 vulnerability · ~${Math.round(o.pop*.44)} need assistance</div></div></div>
${xai?`<div style="margin-top:14px">${f.map(([n,v])=>`<div class="row" style="cursor:default;border:0;padding:5px 0"><span style="width:180px">${n}</span><div class="bar" style="flex:1"><i style="width:${v*2}%"></i></div><b>${v}%</b></div>`).join('')}</div>`:''}</div></div>`;
$('#ic').innerHTML=`<div class="hd"><div><div class="eye">Ground signals<span>• Real-time cross-source triangulation</span></div><h1>Ground Signal Verification</h1><div class="mute">Citizen reports, river gauges and cameras are cross-checked to confirm the forecast is tracking reality.</div></div><div class="chips">${['ALL','CRITICAL','HIGH','MODERATE','LOW'].map(x=>`<button data-f="${x}" class="${x==flt?'on':''}">${x}</button>`).join('')}</div></div><div class="card" style="padding:0;overflow-x:auto"><table><tr><th>Incident</th><th>Sector location</th><th>Telemetry source</th><th>Severity</th><th>AI confidence</th><th>State</th><th>Timestamp</th></tr>${INC.filter(i=>flt=='ALL'||i[4]==flt).map(i=>`<tr><td><b>${i[0]}</b><br><span class="mute">${i[1]}</span></td><td>${i[2]}</td><td class="mute">${i[3]}</td><td><span class="pill ${pc(i[4])}">${i[4]}</span></td><td><b>${i[5]}%</b></td><td><b class="${i[6]?'lo':'hi'}">${i[6]?'✓ VERIFIED':i[5]>=70?'LIKELY':'UNVERIFIED'}</b></td><td class="mute">${i[7]}</td></tr>`).join('')}</table></div>`;
const w=Z.map((z,i)=>rs[i]>=55?rs[i]*z.pop:0),U=[['Pumps',4],['Boats',3],['Ambulances',3]],A=U.map(u=>alloc(w,u[1]));
$('#rs').innerHTML=`<div class="hd"><div><div class="eye">Pre-emptive evacuation planning<span>• Decisions made days before the flood</span></div><h1>Evacuation Plan & Decision Roadmap</h1><div class="mute">Plan who moves, where and when, while there is still time. Routes are scored at the projected peak and re-scored as the forecast changes.</div></div><div class="chips"><button data-m="ev" class="${mode=='ev'?'on':''}">Evacuation Plan</button><button data-m="rc" class="${mode=='rc'?'on':''}">Pre-positioning</button></div></div>`+(mode=='ev'?`<div class="card" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:16px"><div><span class="mute">ORIGIN ZONE</span><br><select id="org">${Z.map((z,i)=>`<option value="${i}" ${i==ZS?'selected':''}>${z.n} (${rs[i]})</option>`).join('')}</select></div><div><span class="mute">SUGGESTED SHELTER</span><br><b>${b.s.id} ${b.s.n}</b> · ${b.s.beds.toLocaleString()} beds</div><button style="margin-left:auto;color:var(--crit)" data-u="1">${uf?'Clear early-flooding test':'Test: underpasses flood early'}</button></div>${roadmap(o)}
<div class="g g2" style="grid-template-columns:minmax(280px,1fr) 2fr"><div>${b.sf<35?`<div class="rt best"><b class="cr">NO SAFE GROUND ROUTE</b><br>All corridors compromised. Request boat evacuation from ${b.s.id}.</div>`:`<div class="rt best"><div style="display:flex;justify-content:space-between"><b class="eye">Route ${b.k} • Recommended corridor</b><b class="lo">${b.sf}% Safety</b></div><div class="big" style="font-size:22px">${b.mins} min transit time</div><ul><li>${b.k=='C'?'Elevated topography avoids water buildup':'Lowest flood exposure among open routes'}</li><li>Synchronized green light traffic priority</li><li>${b.s.n} has ${b.s.beds.toLocaleString()} available beds</li></ul></div>`}
${R.filter(c=>c!=b).map(c=>`<div class="rt"><div style="display:flex;justify-content:space-between"><b style="color:${rc(c.st)}">Route ${c.k} (${c.n})</b><span class="pill ${c.st=='BLOCKED'?'sc':c.st=='SAFE'?'sl':'sh'}">${c.st}</span></div><div class="mute">${c.mins} min • ${c.k=='A'?`Underpass depth ${(1.4*Math.min(1,c.r/90)*(uf?1.3:1)).toFixed(1)}m projected near Day ${o.d}`:c.k=='B'?'Heavy commercial traffic gridlock + curb water':'Longer, elevated detour'} • Safety ${c.sf}%</div></div>`).join('')}
<button class="pri" style="width:100%;padding:13px" data-a="1">${auth?'✓ Evacuation plan approved':'Approve Evacuation Plan →'}</button></div><div>${map(1)}</div></div>`:`<div class="card"><h2>Pre-positioning plan by projected risk × exposed population</h2><table><tr><th>Zone</th><th>Risk</th>${U.map(u=>`<th>${u[0]}</th>`).join('')}</tr>${Z.map((z,i)=>w[i]?`<tr><td><b>${z.n}</b></td><td>${rs[i]}</td>${A.map(a=>`<td>${a[i]}</td>`).join('')}</tr>`:'').join('')}</table></div>`);
$('#an').innerHTML=`<div class="hd"><div><div class="eye">Operational benchmarks<span>• Impact assessment & latency compression</span></div><h1>Emergency Performance Analytics</h1><div class="mute">Quantifiable time compression in detection, multi-sensor verification, and safe corridor routing.</div></div><span class="pill sl">● Validated scenario metrics</span></div><div class="g g4">${[['Prediction lead time','4–7 days','var(--acc)','Advance warning before the projected river crest'],['Forecast confidence','91%','var(--low)','At 5-day lead, from weather, river and terrain data'],['Decision window','~3 days','var(--ink)','Time authorities get to approve evacuation and pre-position'],['Lives protected exposure','284,500','var(--acc)','Citizens covered by precision micro-zoning']].map(k=>`<div class="card kp"><small>${k[0]}</small><div class="big" style="color:${k[2]}">${k[1]}</div><div class="mute">${k[3]}</div></div>`).join('')}</div><div class="card" style="margin-top:16px"><h2>Operational protocol comparison <span class="lo" style="float:right;text-transform:none">Decisions move from hours-after to days-before</span></h2><div class="g" style="grid-template-columns:1fr 1fr"><div class="mini" style="padding:16px"><b class="cr">TRADITIONAL EMERGENCY RESPONSE</b>${['Flood is noticed only when water reaches the streets','Evacuation starts after roads are already flooded','Static routes that ignore underpass flooding','Late, city-wide SMS warnings'].map(x=>`<div>✕ ${x}</div>`).join('')}</div><div class="mini" style="padding:16px;background:var(--a2)"><b style="color:var(--acc)">FLOODSHIELD AI AUTONOMOUS COORDINATION</b>${['4–7 day forecast from weather, river-gauge and terrain data','Ward-level risk and vulnerability mapping before the rain arrives','Evacuation routes and shelters planned days ahead, re-scored as forecasts change','Staged, multilingual alerts only to residents in at-risk zones'].map(x=>`<div>✓ ${x}</div>`).join('')}</div></div></div>`}
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',4500)};
function go(p){tab=p;document.querySelectorAll('.pg').forEach(s=>s.classList.toggle('on',s.id==p));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));scrollTo(0,0)}
function sim(){if(pl){clearInterval(pl);pl=0;$('#sim').textContent='▶ Simulation';return}T=0;$('#sim').textContent='⏸ Pause';render();pl=setInterval(()=>{if(T>=5){sim();return}T++;render()},1500)}
document.addEventListener('click',e=>{const q=k=>e.target.closest('['+k+']');let x;
if(x=q('data-p'))go(x.dataset.p);else if(x=q('data-t'))T=+x.dataset.t;else if(x=q('data-z'))ZS=+x.dataset.z;else if(x=q('data-f'))flt=x.dataset.f;else if(x=q('data-m'))mode=x.dataset.m;else if(q('data-x'))xai=!xai;
else if(q('data-u')){uf=!uf;LOG.unshift(uf?'Underpass flooding simulated: Route A compromised for all origin zones · just now':'Underpass simulation cleared · just now')}
else if(q('data-a')){const o=Z[ZS],b=best(routes(o));auth=1;LOG.unshift(`Evacuation plan approved: ${o.n} via Route ${b.k} to ${b.s.id} · just now`);toast(`Plan approved: Route ${b.k} to ${b.s.n}. Advisory scheduled for Day ${Math.floor(o.d-1.5)} to ${o.pop.toLocaleString()} residents; 6 units to be pre-positioned.`)}
else if(e.target.closest('#sim')){sim();return}else if(e.target.closest('#cop')){const rs=Z.map(risk),i=rs.indexOf(Math.max(...rs)),b=best(routes(Z[i]));toast(`Copilot: ${Z[i].n} is highest at ${rs[i]}/100 (${TL[T]}); flood expected ~Day ${Z[i].d}, so approve the plan by Day ${Math.floor(Z[i].d-2)}. Suggested route: ${b.k} to ${b.s.n}, ${b.mins} min, ${b.sf}% safety.`);return}else return;render()});
document.addEventListener('change',e=>{if(e.target.id=='org'){ZS=+e.target.value;render()}});
render();
</script></body></html>
